}

.slice-label {
  font-size: 15px;
  font-weight: 600;
  fill: white;
  text-anchor: middle;
  dominant-baseline: central;
}

.legend-item {
  transform: translateX(-500%);
  animation: slideIn 2s ease-in-out forwards;
}

@keyframes slideIn {
